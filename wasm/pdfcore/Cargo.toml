[package]
name = "pdfcore"
version = "0.1.0"
edition = "2021"
description = "WASM core for in-browser PDF utilities: lossless re-save + document probing (lopdf)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# lopdf: pure-Rust PDF object model. Compiles to wasm32-unknown-unknown;
# the wasm_js feature on getrandom (pulled in by lopdf's crypto/rand deps)
# is what selects the browser RNG backend for that target.
lopdf = "0.37"
wasm-bindgen = "0.2"
# Direct dependency so the `wasm_js` feature is unified into the shared
# getrandom copy for wasm32-unknown-unknown builds (see lopdf#408).
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
